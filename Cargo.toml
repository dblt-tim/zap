[workspace]
resolver = "2"
members = [
    "crates/zap",
    "sandbox",

    "crates/zap_core",
    "crates/zap_render",
    "crates/zap_ecs"
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
zap = { path = "crates/zap" }
zap_core = { path = "crates/zap_core" }
zap_render = { path = "crates/zap_render" }
zap_ecs = { path = "crates/zap_ecs" }

anyhow = "1.0.104"
env_logger = "0.11.11"
log = "0.4.35"
winit = "0.30.13"
pollster = "1.0.1"
wgpu = "30.0.2"
glam = "0.34.3"